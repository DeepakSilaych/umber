<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Umber logo">
  <title>Umber</title>
  <defs>
    <linearGradient id="umber" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8C5A34"/>
      <stop offset="1" stop-color="#4E2F1B"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#umber)"/>

  <!-- Three ascending bars: the 24h / 7d / 30d windows the whole app is built around. -->
  <rect x="148" y="272" width="56" height="92"  rx="14" fill="#F2E4D4" fill-opacity="0.55"/>
  <rect x="228" y="212" width="56" height="152" rx="14" fill="#F2E4D4" fill-opacity="0.78"/>
  <rect x="308" y="148" width="56" height="216" rx="14" fill="#F7EDE2"/>

  <!-- Baseline. -->
  <rect x="132" y="384" width="248" height="10" rx="5" fill="#F7EDE2" fill-opacity="0.32"/>
</svg>
